<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Hay Feeder Render</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#cfdce6}canvas{display:block}
#ui{position:fixed;top:16px;left:16px;padding:8px 12px;border-radius:8px;background:rgba(255,255,255,.85);font:14px/1.2 -apple-system,system-ui,sans-serif;color:#222;box-shadow:0 1px 4px rgba(0,0,0,.15);user-select:none}#ui label{display:flex;align-items:center;gap:8px;cursor:pointer}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="ui" hidden><label><input type="checkbox"> Square bales (4 nets)</label></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// Units: inches. x = left->right (0..84 deck), y = up (ground = 0, deck top = 12),
// d = depth from front edge of deck (0 front .. 72 back); three z = -d.
const params = new URLSearchParams(location.search);
const view = params.get('view') || 'front';
// nets=1 hangs 4 vertical square-bale nets (one per side); the round bale is then off unless bale=1
const showNets = params.get('nets') === '1';
const showBale = params.has('bale') ? params.get('bale') !== '0' : !showNets;
const showRoof = params.get('roof') !== '0';
// fixed size when w/h are given (screenshots), otherwise fill the window
const fixed = params.has('w') || params.has('h');
const W = +(params.get('w') || (fixed ? 1600 : innerWidth)), H = +(params.get('h') || (fixed ? 1100 : innerHeight));

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();

// ---------- backdrop ----------
{
  const c = document.createElement('canvas'); c.width = 2; c.height = 512;
  const g = c.getContext('2d'); const gr = g.createLinearGradient(0, 0, 0, 512);
  gr.addColorStop(0, '#eef1f3'); gr.addColorStop(1, '#c6cdd3');
  g.fillStyle = gr; g.fillRect(0, 0, 2, 512);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  scene.background = t;
}

// ---------- textures ----------
let seed = 7;
const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

function noiseTexture(base, spread, size = 256, rowCorr = 1) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'); const img = g.createImageData(size, size);
  const col = new THREE.Color(base);
  for (let y = 0; y < size; y++) {
    // row-correlated streaks read as grain once stretched along a board
    const row = (rand() - 0.5) * spread * rowCorr;
    for (let x = 0; x < size; x++) {
      const n = row + (rand() - 0.5) * spread * 0.5;
      const i = (y * size + x) * 4;
      img.data[i] = Math.max(0, Math.min(255, col.r * 255 * (1 + n)));
      img.data[i + 1] = Math.max(0, Math.min(255, col.g * 255 * (1 + n)));
      img.data[i + 2] = Math.max(0, Math.min(255, col.b * 255 * (1 + n)));
      img.data[i + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
const grainTex = noiseTexture('#ffffff', 0.18);

const matCache = {};
function wood(baseHex, vary = 0.08) {
  // per-board tint so individual boards read
  const c = new THREE.Color(baseHex);
  const hsl = {}; c.getHSL(hsl);
  c.setHSL(hsl.h + (rand() - 0.5) * 0.015, hsl.s * (1 + (rand() - 0.5) * vary * 2), hsl.l * (1 + (rand() - 0.5) * vary));
  return new THREE.MeshStandardMaterial({ color: c, map: grainTex, roughness: 0.92, metalness: 0 });
}
const PT = '#8f8a62';        // pressure-treated, greenish
const HEM = '#c49a63';       // rough hemlock
const steel = new THREE.MeshStandardMaterial({ color: '#c3c8cc', roughness: 0.38, metalness: 0.75 });
const guard = new THREE.MeshStandardMaterial({ color: '#a7adb2', roughness: 0.45, metalness: 0.7 });
const iron = new THREE.MeshStandardMaterial({ color: '#2a2a2a', roughness: 0.6, metalness: 0.5 });

const edgeMat = new THREE.LineBasicMaterial({ color: '#3a2c1c', transparent: true, opacity: 0.22 });
function addEdges(mesh) {
  const e = new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry, 30), edgeMat);
  mesh.add(e);
}
function finish(mesh, parent = scene, edges = true) {
  mesh.castShadow = true; mesh.receiveShadow = true;
  if (edges) addEdges(mesh);
  parent.add(mesh);
  return mesh;
}

// axis-aligned box in feeder coords
function box(x0, x1, y0, y1, d0, d1, mat, parent = scene, edges = true) {
  const g = new THREE.BoxGeometry(x1 - x0, y1 - y0, d1 - d0);
  const m = new THREE.Mesh(g, mat);
  m.position.set((x0 + x1) / 2, (y0 + y1) / 2, -(d0 + d1) / 2);
  return finish(m, parent, edges);
}

// extrude a 2D polygon (local u,v) along n by `thick`, placed at origin o (three coords)
function slab(pts, o, u, v, n, thick, mat) {
  let nn = n.clone(), oo = o.clone();
  const det = new THREE.Matrix3().set(u.x, v.x, nn.x, u.y, v.y, nn.y, u.z, v.z, nn.z).determinant();
  let P = pts;
  if (det < 0) { P = pts.map(([a, b]) => [a, b]); oo.add(nn.clone().multiplyScalar(thick)); nn.negate(); }
  const shape = new THREE.Shape(P.map(([a, b]) => new THREE.Vector2(a, b)));
  const g = new THREE.ExtrudeGeometry(shape, { depth: thick, bevelEnabled: false });
  const m4 = new THREE.Matrix4().makeBasis(u, v, nn).setPosition(oo);
  g.applyMatrix4(m4);
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, mat);
  m.material.side = THREE.DoubleSide;
  return finish(m);
}
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const P3 = (x, y, d) => V(x, y, -d);

// ---------- base ----------
// skids 4x6 on edge, chamfered ends
for (const x0 of [3.5, 40.25, 77]) {
  const pts = [[0, 2], [2, 0], [70, 0], [72, 2], [72, 5.5], [0, 5.5]]; // (d, y)
  slab(pts, P3(x0, 0, 0), V(0, 0, -1), V(0, 1, 0), V(1, 0, 0), 3.5, wood(PT));
}
// joists 2x6 (PT 1.5 x 5.5) on top of skids
for (const d of [3.5, 14, 24.75, 35.25, 45.75, 56.5, 67]) box(0, 84, 5.5, 11, d, d + 1.5, wood(PT));
// deck boards 5/4x6, run front to back, 1/4" gaps
for (let x = 0; x < 84; x += 5.75) box(x, Math.min(x + 5.5, 84), 11, 12, 0, 72, wood(PT, 0.12));

// corner posts 4x4 on 1" scrap
box(0, 3.5, 1, 115, 0, 3.5, wood(PT));
box(80.5, 84, 1, 115, 0, 3.5, wood(PT));
box(0, 3.5, 1, 97, 68.5, 72, wood(PT));
box(80.5, 84, 1, 97, 68.5, 72, wood(PT));

// skirts 2x10 (1.5 x 9.25), top tight under deck
box(-1.5, 0, 1.75, 11, 0, 72, wood(PT));
box(84, 85.5, 1.75, 11, 0, 72, wood(PT));
box(-1.5, 85.5, 1.75, 11, -1.5, 0, wood(PT));   // front (removable)
box(-1.5, 85.5, 1.75, 11, 72, 73.5, wood(PT));  // rear

// ---------- walls (rough 2x6 = 2" x 6") ----------
const slatRows = [[11, 17], [17, 23], [23, 29], [47, 53]]; // 3 solid + top slat, 18" window
for (const [y0, y1] of slatRows) {
  box(-2, 0, y0, y1, 0, 72, wood(HEM));        // left
  box(84, 86, y0, y1, 0, 72, wood(HEM));       // right
  box(-2, 86, y0, y1, 72, 74, wood(HEM));      // rear
}
// chew guards on window bottoms and wall tops
function cap(x0, x1, d0, d1, ytop) { box(x0 - 0.15, x1 + 0.15, ytop - 1.2, ytop + 0.12, d0 - 0.15, d1 + 0.15, guard, scene, false); }
for (const yt of [29, 53]) {
  cap(-2, 0, 0, 72, yt); cap(84, 86, 0, 72, yt); cap(-2, 86, 72, 74, yt);
}

// ---------- headers, rails ----------
box(-6, 90, 109, 115, -2, 0, wood(HEM));          // front header, outside face of front posts
box(-6, 90, 91, 97, 66.5, 68.5, wood(HEM));       // rear header, inside face of rear posts
box(3.5, 5.5, 82, 88, 0, 72, wood(HEM));          // left side rail
box(78.5, 80.5, 82, 88, 0, 72, wood(HEM));        // right side rail

// knee braces: trapezoid 2x4, 45 deg, 22" long edge
const L = 22 / Math.SQRT2, wv = 4 * Math.SQRT2;
const brace = [[0, L], [0, L - wv], [L - wv, 0], [L, 0]];
// header braces (in x-y plane), corner at post face / header bottom
slab(brace, P3(3.5, 109, 0), V(1, 0, 0), V(0, -1, 0), V(0, 0, -1), 2, wood(HEM));
slab(brace, P3(80.5, 109, 0), V(-1, 0, 0), V(0, -1, 0), V(0, 0, -1), 2, wood(HEM));
slab(brace, P3(3.5, 91, 68.5), V(1, 0, 0), V(0, -1, 0), V(0, 0, -1), 2, wood(HEM));
slab(brace, P3(80.5, 91, 68.5), V(-1, 0, 0), V(0, -1, 0), V(0, 0, -1), 2, wood(HEM));
// side-rail braces (in d-y plane), outside face of rails
slab(brace, P3(3.5, 82, 3.5), V(0, 0, -1), V(0, -1, 0), V(-1, 0, 0), 2, wood(HEM));
slab(brace, P3(3.5, 82, 68.5), V(0, 0, 1), V(0, -1, 0), V(-1, 0, 0), 2, wood(HEM));
slab(brace, P3(80.5, 82, 3.5), V(0, 0, -1), V(0, -1, 0), V(1, 0, 0), 2, wood(HEM));
slab(brace, P3(80.5, 82, 68.5), V(0, 0, 1), V(0, -1, 0), V(1, 0, 0), 2, wood(HEM));

// ---------- doors ----------
function door(x0, x1, hingeLeft) {
  const yb = 13, yt = 53;
  for (const [a, b] of [[0, 6], [6, 12], [12, 18], [34, 40]]) box(x0, x1, yb + a, yb + b, 0, 2, wood(HEM));
  box(x0, x0 + 4, yb, yt, 2, 4, wood(HEM));      // stiles
  box(x1 - 4, x1, yb, yt, 2, 4, wood(HEM));
  // diagonal: bottom of hinge side -> top of latch side
  const ang = Math.atan2(yt - yb, x1 - x0 - 8);
  const h = 4 / Math.cos(ang);
  const xa = hingeLeft ? x0 + 4 : x1 - 4, xb = hingeLeft ? x1 - 4 : x0 + 4;
  const pts = [[xa, yb], [xa, yb + h], [xb, yt], [xb, yt - h]];
  slab(pts, V(0, 0, -2), V(1, 0, 0), V(0, 1, 0), V(0, 0, -1), 2, wood(HEM, 0.12));
  cap(x0, x1, 0, 2, yb + 18); cap(x0, x1, 0, 2, yt);
  // T-hinges: strap across slats, T plate on post face
  for (const yh of [yb + 3, yb + 37]) {
    const dir = hingeLeft ? 1 : -1;
    const xp = hingeLeft ? 0.5 : 83.5;
    const tip = xp + dir * 15;
    const strap = [[xp, yh - 0.9], [tip, yh - 0.35], [tip, yh + 0.35], [xp, yh + 0.9]];
    slab(strap, V(0, 0, 0), V(1, 0, 0), V(0, 1, 0), V(0, 0, 1), 0.18, iron);
    box(xp + 0.8 * dir - 0.7, xp + 0.8 * dir + 0.7, yh - 2.5, yh + 2.5, -0.2, 0, iron, scene, false);
  }
}
door(4, 41.75, true);
door(42.25, 80, false);
// slide-bolt latch across both doors
box(37, 47, 48.6, 50.4, -0.35, 0, iron, scene, false);
box(39, 45, 49.1, 49.9, -0.6, -0.35, steel, scene, false);

// front drop bar between side rails, in U holders
box(5.5, 78.5, 82, 88, 4, 6, wood(HEM));
cap(5.5, 78.5, 4, 6, 88);
for (const x of [5.5, 77.5]) box(x, x + 1, 81.5, 86, 3.5, 6.5, iron, scene, false);

// ---------- roof ----------
if (showRoof) {
  const theta = Math.atan2(18, 68.5);
  const roof = new THREE.Group();
  roof.position.set(0, 115 - 35 * 18 / 68.5, -35);
  roof.rotation.x = -theta;
  scene.add(roof);
  // local: x = x, y = up off rafter bottom line, z = along slope (+ toward front/high side)
  const lbox = (x0, x1, y0, y1, z0, z1, mat, edges = true) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0), mat);
    m.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
    return finish(m, roof, edges);
  };
  for (let i = 0; i < 5; i++) { const xc = -5 + i * 23.5; lbox(xc - 1, xc + 1, 0, 4, -48, 48, wood(HEM)); }
  for (let i = 0; i < 5; i++) { const zc = -46 + i * 23; lbox(-12, 96, 4, 5, zc - 2, zc + 2, wood(HEM)); }
  // ribbed steel panels: flat sheet + major ribs every 9"
  const sheetMat = steel;
  lbox(-12, 96, 5, 5.06, -48, 48, sheetMat, false);
  for (let x = -12 + 4.5; x < 96; x += 9) {
    const shape = new THREE.Shape([new THREE.Vector2(-1.3, 0), new THREE.Vector2(1.3, 0), new THREE.Vector2(0.5, 0.75), new THREE.Vector2(-0.5, 0.75)]);
    const g = new THREE.ExtrudeGeometry(shape, { depth: 96, bevelEnabled: false });
    const m = new THREE.Mesh(g, sheetMat);
    m.position.set(x, 5.05, -48);
    finish(m, roof, false);
  }
  // panel side-lap seams
  for (const x of [24, 60]) lbox(x - 0.05, x + 0.05, 5.06, 5.9, -48, 48, iron, false);
  // drip edge on the low (rear) edge
  lbox(-12.2, 96.2, 3.6, 6.0, -48.6, -48, steel, false);
}

// ---------- hay ----------
let hayTex;
function hayTexture() {
  if (hayTex) return hayTex;
  const c = document.createElement('canvas'); c.width = 512; c.height = 256;
  const g = c.getContext('2d'); g.fillStyle = '#c8ad6a'; g.fillRect(0, 0, 512, 256);
  for (let i = 0; i < 2600; i++) {
    const y = rand() * 256, x = rand() * 512, l = 10 + rand() * 40;
    g.strokeStyle = `rgba(${90 + rand() * 120},${80 + rand() * 90},${30 + rand() * 50},${0.25 + rand() * 0.4})`;
    g.lineWidth = 0.6 + rand() * 1.4;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + l, y + (rand() - 0.5) * 6); g.stroke();
  }
  hayTex = new THREE.CanvasTexture(c); hayTex.colorSpace = THREE.SRGBColorSpace;
  return hayTex;
}

// ---------- hay-net eye bolts (3/8" forged shoulder, eye down) + carabiners ----------
// one per net: [x, underside y, d, member runs along x]
const eyes = [
  [4.5, 82, 36, false],     // left side rail, centered
  [79.5, 82, 36, false],    // right side rail, centered
  [45.5, 91, 67.5, true],   // rear header, just right of the center rafter
  [42, 82, 5, true],        // front drop bar, centered
];
function part(geo, mat, parent, x, y, z) {
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z);
  m.castShadow = true; parent.add(m); return m;
}
for (const [x, yb, d, alongX] of eyes) {
  const g = new THREE.Group(); g.position.set(x, yb, -d);
  if (!alongX) g.rotation.y = Math.PI / 2;
  scene.add(g);
  part(new THREE.TorusGeometry(0.7, 0.2, 10, 24), steel, g, 0, -1.15, 0);           // eye
  part(new THREE.CylinderGeometry(0.45, 0.45, 0.25, 12), steel, g, 0, -0.15, 0);   // shoulder
  part(new THREE.CylinderGeometry(1.1, 1.1, 0.12, 20), steel, g, 0, 6.2, 0);       // fender washer
  part(new THREE.CylinderGeometry(0.33, 0.33, 0.7, 6), steel, g, 0, 6.6, 0);       // jam nuts
  const cara = part(new THREE.TorusGeometry(0.55, 0.13, 8, 20), steel, g, 0, -2.6, 0);
  cara.rotation.y = Math.PI / 2; cara.scale.y = 1.9;
}
const caraBottom = 3.65; // below the member's underside

// ---------- square-bale nets ----------
const netGroup = new THREE.Group(); scene.add(netGroup);
{
  // full small-square-bale net hanging on end from one hook: height, half-widths along / across the wall; top y
  const NH = 38, RA = 11, RX = 8.5, NTOP = 76;
  // lathe profile: gathered neck at the hook, full body, rounded bottom. `lean` shifts the body
  // across the wall (local z) so it rests against the wall instead of hanging through it.
  const netGeo = (grow, lean) => {
    const pts = [];
    for (let i = 0; i <= 40; i++) {
      const sd = 1 - i / 40; // 1 bottom .. 0 top
      let r = sd < 0.22 ? 0.1 + 0.9 * Math.sin(Math.PI / 2 * sd / 0.22)
        : sd > 0.88 ? Math.sqrt(Math.max(0, 1 - ((sd - 0.88) / 0.12) ** 2))
        : 1 + 0.05 * Math.sin(Math.PI * (sd - 0.22) / 0.66);
      pts.push(new THREE.Vector2(r + grow / 10, -sd * NH));
    }
    const g = new THREE.LatheGeometry(pts, 32);
    const p = g.attributes.position;
    for (let i = 0; i < p.count; i++) {
      const sd = -p.getY(i) / NH, w = Math.min(1, sd / 0.35);
      p.setX(i, p.getX(i) * RA);
      p.setZ(i, p.getZ(i) * RX + lean * w * w * (3 - 2 * w));
    }
    g.computeVertexNormals();
    return g;
  };
  // diamond mesh as an alpha map
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'); g.fillStyle = '#000'; g.fillRect(0, 0, 64, 64);
  g.strokeStyle = '#fff'; g.lineWidth = 6;
  for (const [a, b] of [[[0, 0], [64, 64]], [[64, 0], [0, 64]], [[-32, 32], [32, -32]], [[32, 96], [96, 32]], [[-32, 32], [32, 96]], [[32, -32], [96, 32]]]) {
    g.beginPath(); g.moveTo(...a); g.lineTo(...b); g.stroke();
  }
  const netTex = new THREE.CanvasTexture(c);
  netTex.wrapS = netTex.wrapT = THREE.RepeatWrapping; netTex.repeat.set(28, 18);
  const hayMat = new THREE.MeshStandardMaterial({ map: hayTexture(), roughness: 1, side: THREE.DoubleSide });
  const netMat = new THREE.MeshStandardMaterial({ color: '#22382b', alphaMap: netTex, alphaTest: 0.5, side: THREE.DoubleSide, roughness: 0.8 });
  const twine = new THREE.MeshStandardMaterial({ color: '#d9822b', roughness: 0.9 });
  const rod = (a, b, r, mat) => {
    const dir = b.clone().sub(a);
    const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, dir.length(), 6), mat);
    m.position.copy(a).add(b).multiplyScalar(0.5);
    m.quaternion.setFromUnitVectors(V(0, 1, 0), dir.normalize());
    m.castShadow = true; netGroup.add(m);
  };
  // [eye, lean in toward the middle (local z), extra chain drop]
  const nets = [
    [eyes[0], 4.5, 0],     // left
    [eyes[1], -4.5, 0],    // right
    [eyes[2], 4, 9],       // rear: chain brings it down to the others' height
    [eyes[3], -7.5, 0],    // front, resting against the back of the doors
  ];
  for (const [[x, yb, d, alongX], lean, chain] of nets) {
    let y = yb - caraBottom;
    for (let i = 0; i < chain; i++, y -= 0.95) { // short chain: alternating links
      const link = part(new THREE.TorusGeometry(0.42, 0.1, 6, 14), iron, netGroup, x, y - 0.6, -d);
      link.scale.y = 1.6; link.rotation.y = i % 2 ? 0 : Math.PI / 2;
    }
    // baling-twine loop from the carabiner (or chain) down to the net's drawstring
    for (const o of [-0.25, 0.25]) {
      const off = alongX ? V(o, 0, 0) : V(0, 0, o);
      rod(P3(x, y, d).add(off), P3(x, NTOP - 0.3, d).add(off), 0.11, twine);
    }
    const grp = new THREE.Group(); grp.position.set(x, NTOP, -d);
    if (!alongX) grp.rotation.y = Math.PI / 2;
    netGroup.add(grp);
    const body = new THREE.Mesh(netGeo(0, lean), hayMat); body.castShadow = body.receiveShadow = true; grp.add(body);
    const net = new THREE.Mesh(netGeo(0.5, lean), netMat); net.receiveShadow = true; grp.add(net);
  }
}

// ---------- round bale ----------
const baleGroup = new THREE.Group(); scene.add(baleGroup);
{
  const side = hayTexture();
  const c2 = document.createElement('canvas'); c2.width = c2.height = 512;
  const g2 = c2.getContext('2d'); g2.fillStyle = '#bea464'; g2.fillRect(0, 0, 512, 512);
  for (let r = 4; r < 256; r += 2 + rand() * 4) {
    g2.strokeStyle = `rgba(${100 + rand() * 90},${85 + rand() * 70},${35 + rand() * 40},${0.3 + rand() * 0.4})`;
    g2.lineWidth = 1 + rand() * 2; g2.beginPath(); g2.arc(256 + (rand() - .5) * 6, 256 + (rand() - .5) * 6, r, 0, Math.PI * 2); g2.stroke();
  }
  const end = new THREE.CanvasTexture(c2); end.colorSpace = THREE.SRGBColorSpace;
  const geo = new THREE.CylinderGeometry(29, 29, 58, 64, 1);
  const mats = [
    new THREE.MeshStandardMaterial({ map: side, roughness: 1 }),
    new THREE.MeshStandardMaterial({ map: end, roughness: 1 }),
    new THREE.MeshStandardMaterial({ map: end, roughness: 1 }),
  ];
  const bale = new THREE.Mesh(geo, mats);
  bale.rotation.z = Math.PI / 2;
  bale.position.set(42, 12 + 28.5, -38);
  bale.castShadow = bale.receiveShadow = true;
  baleGroup.add(bale);
}

// ---------- lights ----------
scene.add(new THREE.HemisphereLight('#dbe8f5', '#5b5a3a', 0.65));
const sun = new THREE.DirectionalLight('#fff1d8', 3.2);
const sunPos = view === 'rear' ? V(300, 340, -120) : V(-300, 330, 170);
sun.position.copy(sunPos).add(V(42, 0, -36));
sun.target.position.set(42, 40, -36);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -160, right: 160, top: 160, bottom: -160, near: 50, far: 900 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.4;
scene.add(sun, sun.target);
const fill = new THREE.DirectionalLight('#cfe0ff', 0.45);
fill.position.set(400, 150, 300); scene.add(fill);
// soft light from below so the underside reads when orbiting under it
const under = new THREE.DirectionalLight('#fff6e8', 1.6);
under.position.set(-120, -300, 150); scene.add(under);

// ---------- camera ----------
const cam = new THREE.PerspectiveCamera(32, W / H, 1, 5000);
const views = {
  front: { pos: V(-140, 225, 215), at: V(44, 50, -34) },
  rear: { pos: V(270, 175, -290), at: V(40, 48, -36) },
  side: { pos: V(-260, 70, -30), at: V(42, 55, -36) },
  bottom: { pos: V(-140, -250, 200), at: V(42, 55, -36) },
  top: { pos: V(42, 290, 10), at: V(42, 40, -36) },
};
const v = views[view] || views.front;
cam.position.copy(v.pos); cam.lookAt(v.at);

netGroup.visible = showNets;
baleGroup.visible = showBale;
renderer.render(scene, cam);
window.__done = true;

// hay toggle (hidden in fixed-size screenshots): checked = 4 square-bale nets, unchecked = round bale
if (!fixed) {
  const ui = document.getElementById('ui'), box = ui.querySelector('input');
  ui.hidden = false;
  box.checked = showNets;
  box.addEventListener('change', () => {
    netGroup.visible = box.checked;
    baleGroup.visible = !box.checked;
    params.set('nets', box.checked ? '1' : '0'); params.delete('bale');
    history.replaceState(null, '', '?' + params);
    renderer.render(scene, cam);
  });
}

// interactive: drag to orbit, scroll to zoom
const controls = new OrbitControls(cam, renderer.domElement);
controls.target.copy(v.at);
controls.addEventListener('change', () => renderer.render(scene, cam));
controls.update();
if (!fixed) addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix();
  renderer.render(scene, cam);
});
</script>
</body>
</html>
